name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first — no point finishing a run
# whose commit is already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check + test
    runs-on: ubuntu-latest
    # NOT 20, even though `engines` declares node >= 20: pnpm 11 imports
    # node:sqlite, which only exists from Node 22.5 — same note as the amojs
    # repo, whose workflow this mirrors.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `check` bundles the extension with esbuild and then type-checks it.
      - run: pnpm check

      # Grammar and diagnostics tests — plain vitest, no editor involved;
      # every judgement comes from the bundled @amojs.dev/compiler parser.
      - run: pnpm test
