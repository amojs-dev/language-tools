name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first — no point finishing a run
# whose commit is already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check + test
    runs-on: ubuntu-latest
    # NOT 20, even though `engines` declares node >= 20: pnpm 11 imports
    # node:sqlite, which only exists from Node 22.5 — same note as the amojs
    # repo, whose workflow this mirrors.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `check` bundles the extension with esbuild and then type-checks it.
      - run: pnpm check

      # The grammar suite tokenizes against the REAL JavaScript and HTML
      # grammars. A runner has no editor installed, so fetch the same files
      # VS Code ships, from its repo at a pinned tag. Retried: a transient
      # raw.githubusercontent.com failure once failed one matrix job before
      # a single test had run.
      - name: Fetch VS Code grammars
        run: |
          mkdir -p .vscode-grammars/javascript/syntaxes .vscode-grammars/html/syntaxes
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o .vscode-grammars/javascript/syntaxes/JavaScript.tmLanguage.json \
            https://raw.githubusercontent.com/microsoft/vscode/1.100.0/extensions/javascript/syntaxes/JavaScript.tmLanguage.json
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o .vscode-grammars/html/syntaxes/html.tmLanguage.json \
            https://raw.githubusercontent.com/microsoft/vscode/1.100.0/extensions/html/syntaxes/html.tmLanguage.json

      # Grammar tests (real tokenizer, real grammars) + diagnostics tests
      # (every judgement from the bundled @amojs.dev/compiler parser).
      - run: pnpm test
        env:
          AMOJS_EDITOR_EXTENSIONS: ${{ github.workspace }}/.vscode-grammars
